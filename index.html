<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibepedia – the whole world, explained</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌞</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
 
<!--
=====================================================================
  VIBEPEDIA – HOW TO EDIT (full guide is also in the chat reply)
  Everything lives in this ONE file. Three parts:
    1) <style>   → colors & looks   (see ":root" variables first)
    2) <body>    → page skeleton
    3) <script>  → CONFIG, DATA (all the encyclopedia text), and logic
  Quick edits:
    • Change site name / intro text / Wikipedia on-off → CONFIG
    • Add a topic or article                          → DATA
    • Change colors                                   → :root in CSS
    • Change a topic's background animation           → "fx" in DATA
=====================================================================
-->
 
<style>
/* ---------- 1. THEME TOKENS (edit colors here) ---------- */
:root{
  --bg:#fff6e6;          /* page background  */
  --ink:#1b1535;         /* main text        */
  --card:#ffffff;        /* cards            */
  --muted:#6b6385;       /* quiet text       */
  --line:#1b1535;        /* chunky outlines  */
  --pink:#ff5fa2;
  --sun:#ffd23f;
  --grape:#7c5cff;
  --mint:#3de0a8;
  --sky:#8fd8ff;
  --dark:#1b1535;        /* text on bright tiles (never changes) */
  --radius:20px;
  --head:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16112e;--ink:#f5efff;--card:#241c47;--muted:#b3a8d9;--line:#8f7dff;
  }
}
:root[data-theme="dark"]{
  --bg:#16112e;--ink:#f5efff;--card:#241c47;--muted:#b3a8d9;--line:#8f7dff;
}
 
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:700;
  line-height:1.5;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px;border-radius:8px}
mark{background:var(--sun);color:var(--dark);border-radius:4px;padding:0 2px}
 
/* ---------- INTRO (sunrise + birds) ---------- */
#intro{
  position:fixed;inset:0;z-index:100;overflow:hidden;
  background:linear-gradient(180deg,#ff9a8b 0%,#ffcf8b 30%,#9be3ff 70%,#6cc4ff 100%);
  background-size:100% 300%;background-position:0 100%;
  animation:dawn 6s ease-out forwards;
  display:grid;place-items:center;text-align:center;
  transition:opacity .8s ease,transform .8s ease;
}
#intro.out{opacity:0;transform:scale(1.08);pointer-events:none}
@keyframes dawn{to{background-position:0 0}}
.sun{
  position:absolute;left:50%;top:30%;width:min(34vw,220px);aspect-ratio:1;margin-left:calc(min(34vw,220px)/-2);
  border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff7b0,#ffd23f 55%,#ffa51f);
  box-shadow:0 0 60px 20px rgba(255,210,63,.6),0 0 160px 60px rgba(255,170,60,.35);
  transform:translateY(70vh);animation:rise 3.2s cubic-bezier(.2,.8,.2,1) .2s forwards;
}
.sun::before{
  content:"";position:absolute;inset:-90%;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(255,235,120,.55) 0 7deg,transparent 7deg 18deg);
  -webkit-mask-image:radial-gradient(circle,#000 28%,transparent 62%);mask-image:radial-gradient(circle,#000 28%,transparent 62%);
  animation:spin 24s linear infinite;
}
.sun::after{ /* happy face */
  content:"◡‿◡";position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(24px,5vw,46px);color:#b3541e;opacity:.7;letter-spacing:2px;
}
@keyframes rise{to{transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.cloud{position:absolute;background:#fff;border-radius:60px;opacity:.9;animation:cloud linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:160%;left:12%;top:-70%}
.cloud::after{width:40%;height:130%;right:14%;top:-45%}
@keyframes cloud{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.hills{position:absolute;left:0;right:0;bottom:0;height:26vh;pointer-events:none}
.bwrap{position:absolute;left:0;width:48px;animation:fly linear infinite;will-change:transform}
@keyframes fly{from{transform:translateX(-12vw) scale(var(--sc))}to{transform:translateX(112vw) scale(var(--sc))}}
.bwrap svg{display:block;width:100%;animation:bob 1.6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-14px)}}
.intro-card{position:relative;z-index:5;padding:20px;margin-top:22vh}
.intro-card h1{
  font-family:var(--head);font-weight:700;font-size:clamp(46px,11vw,120px);line-height:.95;color:#fff;
  text-shadow:4px 4px 0 var(--dark),8px 8px 0 var(--pink);opacity:0;transform:translateY(30px) rotate(-3deg);
  animation:pop .9s cubic-bezier(.2,1.4,.4,1) 1.6s forwards;
}
.intro-card p{
  margin-top:18px;font-family:var(--head);font-size:clamp(16px,3.2vw,26px);color:var(--dark);font-weight:600;
  opacity:0;animation:pop .8s ease 2.3s forwards;
}
.intro-card .go{
  margin-top:26px;padding:14px 30px;border-radius:999px;background:var(--dark);color:#fff;
  font-family:var(--head);font-size:22px;border:3px solid var(--dark);box-shadow:5px 5px 0 var(--pink);
  opacity:0;animation:pop .7s ease 3s forwards;transition:transform .15s,box-shadow .15s;
}
.intro-card .go:hover{transform:translate(-2px,-2px) rotate(-2deg);box-shadow:8px 8px 0 var(--pink)}
.intro-card .go:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--pink)}
@keyframes pop{to{opacity:1;transform:none}}
.skip{position:absolute;top:14px;right:16px;z-index:6;font-family:var(--head);font-size:15px;color:var(--dark);background:rgba(255,255,255,.7);padding:6px 14px;border-radius:99px}
 
/* ---------- APP SHELL ---------- */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:290px 1fr;grid-template-rows:auto 1fr}
header{
  grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:12px 18px;
  background:var(--card);border-bottom:3px solid var(--line);position:relative;z-index:20;
}
.logo{font-family:var(--head);font-weight:700;font-size:28px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo .sunny{display:inline-block;animation:spin 14s linear infinite}
.logo b{background:linear-gradient(90deg,var(--pink),var(--grape));-webkit-background-clip:text;background-clip:text;color:transparent}
.search{position:relative;flex:1;max-width:720px;margin:0 auto}
.search input{
  width:100%;padding:13px 20px 13px 52px;border-radius:999px;border:3px solid var(--line);background:var(--bg);color:var(--ink);
  font:inherit;font-size:17px;box-shadow:4px 4px 0 var(--pink);transition:box-shadow .15s,transform .15s;
}
.search input:focus{outline:none;box-shadow:6px 6px 0 var(--grape);transform:translate(-1px,-1px)}
.search .mag{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:20px;pointer-events:none}
.search kbd{position:absolute;right:16px;top:50%;transform:translateY(-50%);font:inherit;font-size:13px;border:2px solid var(--line);border-radius:8px;padding:0 8px;color:var(--muted)}
#sugg{
  position:absolute;left:8px;right:8px;top:calc(100% + 10px);background:var(--card);border:3px solid var(--line);border-radius:var(--radius);
  box-shadow:6px 6px 0 var(--line);overflow:hidden;max-height:60vh;overflow-y:auto;display:none;z-index:30;
}
#sugg.open{display:block}
#sugg button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 16px;border-bottom:2px dashed rgba(127,127,160,.3)}
#sugg button:last-child{border-bottom:0}
#sugg button:hover,#sugg button.sel{background:var(--sun);color:var(--dark)}
#sugg .e{font-size:24px}
#sugg small{display:block;color:var(--muted);font-weight:700;font-size:13px}
#sugg button:hover small,#sugg button.sel small{color:var(--dark)}
.hbtns{display:flex;gap:8px}
.ibtn{
  width:46px;height:46px;border-radius:14px;border:3px solid var(--line);background:var(--card);font-size:21px;
  box-shadow:3px 3px 0 var(--line);transition:transform .12s,box-shadow .12s;position:relative;
}
.ibtn:hover{transform:translate(-2px,-2px) rotate(-4deg);box-shadow:5px 5px 0 var(--line)}
.ibtn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--line)}
.ibtn .n{position:absolute;top:-8px;right:-8px;background:var(--pink);color:#fff;border-radius:99px;font-size:12px;padding:0 6px;border:2px solid var(--line)}
 
/* sidebar column */
aside{
  background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(6px);
  border-right:3px solid var(--line);overflow-y:auto;padding:14px 12px 40px;
}
aside h2{font-family:var(--head);font-size:15px;color:var(--muted);margin:6px 8px 10px;font-weight:600}
.navbtn{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;margin-bottom:6px;border-radius:14px;
  border:3px solid transparent;font-size:15px;transition:transform .12s,background .12s;
}
.navbtn .e{font-size:22px;width:30px;text-align:center;transition:transform .25s}
.navbtn .c{margin-left:auto;font-size:12px;color:var(--muted)}
.navbtn:hover{background:color-mix(in srgb,var(--c,var(--sun)) 35%,transparent);transform:translateX(4px)}
.navbtn:hover .e{transform:scale(1.3) rotate(-10deg)}
.navbtn.active{background:var(--c,var(--sun));border-color:var(--line);color:var(--dark);box-shadow:3px 3px 0 var(--line)}
.navbtn.active .c{color:var(--dark)}
 
main{overflow-y:auto;padding:22px clamp(14px,3vw,36px) 80px;scroll-behavior:smooth}
.wrap{max-width:1100px;margin:0 auto}
 
/* hero */
.hero{
  background:var(--sun);color:var(--dark);border:3px solid var(--line);border-radius:28px;box-shadow:8px 8px 0 var(--line);
  padding:clamp(22px,4vw,44px);position:relative;overflow:hidden;
}
.hero h1{font-family:var(--head);font-weight:700;font-size:clamp(32px,6vw,64px);line-height:1;max-width:14ch}
.hero p{margin-top:12px;font-size:clamp(16px,2vw,20px);max-width:46ch}
.hero .big{position:absolute;right:-10px;top:-10px;font-size:clamp(100px,22vw,230px);opacity:.9;animation:wob 5s ease-in-out infinite;pointer-events:none}
@keyframes wob{50%{transform:rotate(12deg) translateY(10px)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{
  padding:7px 14px;border-radius:99px;border:3px solid var(--line);background:#fff;color:var(--dark);font-size:14px;
  box-shadow:3px 3px 0 var(--line);transition:transform .12s;
}
.chip:hover{transform:translate(-2px,-2px) rotate(-2deg);background:var(--pink);color:#fff}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;font-family:var(--head);font-size:15px}
.stats span{background:var(--dark);color:#fff;padding:4px 12px;border-radius:99px}
 
h3.sec{font-family:var(--head);font-size:26px;margin:34px 0 14px;display:flex;align-items:center;gap:10px}
h3.sec small{font-family:var(--body);font-size:14px;color:var(--muted)}
 
/* category tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.tile{
  background:var(--c);color:var(--dark);border:3px solid var(--line);border-radius:var(--radius);padding:16px;text-align:left;
  box-shadow:5px 5px 0 var(--line);transition:transform .15s,box-shadow .15s;min-height:128px;display:flex;flex-direction:column;gap:4px;
  position:relative;overflow:hidden;
}
.tile:hover{transform:translate(-3px,-3px) rotate(-1deg);box-shadow:9px 9px 0 var(--line)}
.tile .e{font-size:38px;transition:transform .3s}
.tile:hover .e{transform:scale(1.25) rotate(12deg)}
.tile b{font-family:var(--head);font-size:19px;line-height:1.1}
.tile small{font-size:13px;opacity:.8}
 
/* category banner */
.banner{
  background:var(--c);color:var(--dark);border:3px solid var(--line);border-radius:28px;box-shadow:8px 8px 0 var(--line);
  padding:clamp(20px,4vw,38px);display:flex;gap:22px;align-items:center;position:relative;overflow:hidden;
}
.banner .e{font-size:clamp(64px,12vw,120px);animation:bounce 2.2s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-14px) rotate(8deg)}}
.banner h1{font-family:var(--head);font-size:clamp(30px,5.5vw,56px);line-height:1}
.banner p{margin-top:8px;max-width:52ch}
.crumb{margin-bottom:14px;font-size:14px}
.crumb button{color:var(--muted);text-decoration:underline;text-underline-offset:3px}
 
/* article cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px;margin-top:26px}
.card{
  background:var(--card);border:3px solid var(--line);border-radius:var(--radius);padding:18px;text-align:left;
  box-shadow:5px 5px 0 var(--c,var(--pink));display:flex;flex-direction:column;gap:8px;
  transition:transform .15s,box-shadow .15s;animation:cardIn .5s both;position:relative;
}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.97)}}
.card:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--c,var(--pink))}
.card h4{font-family:var(--head);font-size:21px;line-height:1.15;display:flex;gap:8px;align-items:center}
.card h4 i{font-style:normal;background:var(--c);color:var(--dark);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:19px;flex:none;border:2px solid var(--line)}
.card p{font-size:15px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .tag{font-size:12px;color:var(--muted);margin-top:auto}
.star{position:absolute;top:10px;right:10px;font-size:20px;opacity:.35;transition:transform .2s,opacity .2s}
.star:hover{transform:scale(1.4) rotate(15deg);opacity:1}
.star.on{opacity:1}
 
/* modal */
#modal{position:fixed;inset:0;z-index:60;background:rgba(20,10,50,.55);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px}
#modal.open{display:flex}
.sheet{
  width:min(720px,100%);max-height:92vh;overflow-y:auto;background:var(--card);border:3px solid var(--line);border-radius:28px;
  box-shadow:10px 10px 0 var(--c,var(--pink));animation:sheet .45s cubic-bezier(.2,1.3,.4,1);position:relative;
}
@keyframes sheet{from{opacity:0;transform:scale(.8) rotate(-3deg)}}
.sheet .top{background:var(--c);color:var(--dark);padding:26px 26px 20px;display:flex;gap:18px;align-items:center;border-bottom:3px solid var(--line)}
.sheet .top .e{font-size:64px;animation:bounce 2s ease-in-out infinite}
.sheet .top small{display:inline-block;background:var(--dark);color:#fff;border-radius:99px;padding:2px 12px;font-family:var(--head);font-size:13px}
.sheet h2{font-family:var(--head);font-size:clamp(28px,5vw,42px);line-height:1.05;margin-top:4px}
.sheet .bd{padding:22px 26px 28px;font-size:18px}
.sheet .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.btn{
  padding:10px 18px;border-radius:99px;border:3px solid var(--line);background:var(--card);box-shadow:3px 3px 0 var(--line);font-family:var(--head);font-size:16px;
  transition:transform .12s,box-shadow .12s;
}
.btn:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--line)}
.btn.pri{background:var(--pink);color:#fff}
.close{position:absolute;top:12px;right:14px;z-index:2;width:38px;height:38px;border-radius:50%;background:var(--dark);color:#fff;font-size:18px}
.live{margin-top:20px;display:grid;gap:12px}
.lcard{display:flex;gap:12px;padding:12px;border:3px dashed var(--line);border-radius:16px;font-size:15px}
.lcard img{width:84px;height:84px;object-fit:cover;border-radius:12px;flex:none;border:2px solid var(--line)}
.lcard b{font-family:var(--head);font-size:18px}
.lcard p{font-weight:600;color:var(--muted);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.lcard a{color:var(--grape);text-decoration:underline;text-underline-offset:3px}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.empty{text-align:center;padding:50px 10px;font-size:20px;font-family:var(--head)}
.loading{display:inline-block;animation:spin 1s linear infinite}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 20px;border-radius:99px;z-index:90;font-family:var(--head);animation:pop .3s both}
 
/* ---------- RESPONSIVE ---------- */
@media (max-width:860px){
  #app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
  header{flex-wrap:wrap;gap:10px}
  .search{order:3;flex-basis:100%;max-width:none}
  .search kbd{display:none}
  .hbtns{margin-left:auto}
  aside{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:10px;border-right:0;border-bottom:3px solid var(--line)}
  aside h2{display:none}
  .navbtn{width:auto;flex:none;white-space:nowrap;margin:0}
  .navbtn .c{display:none}
  .banner{flex-direction:column;text-align:center}
  .hero .big{opacity:.25}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
 
<body>
 
<!-- ============ INTRO ANIMATION ============ -->
<div id="intro" aria-label="Welcome animation">
  <div class="sun"></div>
  <div class="cloud" style="top:12%;width:150px;height:38px;animation-duration:40s"></div>
  <div class="cloud" style="top:26%;width:210px;height:48px;animation-duration:58s;animation-delay:-20s"></div>
  <div class="cloud" style="top:48%;width:120px;height:30px;animation-duration:34s;animation-delay:-8s"></div>
  <div id="birds"></div>
  <svg class="hills" viewBox="0 0 1200 200" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 120 Q150 40 300 110 T600 100 T900 90 T1200 110 V200 H0Z" fill="#7be08a"/>
    <path d="M0 160 Q200 90 420 150 T800 140 T1200 150 V200 H0Z" fill="#3cc47c"/>
  </svg>
  <button class="skip" id="skip">skip ⏭</button>
  <div class="intro-card">
    <h1 id="introTitle">Vibepedia</h1>
    <p id="introSub">the whole world, explained for Gen Z &amp; Gen Alpha</p>
    <button class="go" id="enter">Let’s go 🚀</button>
  </div>
</div>
 
<!-- ============ APP ============ -->
<canvas id="fx" aria-hidden="true"></canvas>
<div id="app">
  <header>
    <button class="logo" id="logo" aria-label="Home"><span class="sunny">🌞</span><b id="siteName">Vibepedia</b></button>
    <div class="search" role="search">
      <span class="mag">🔎</span>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search anything… rizz, black holes, Roblox, Hinglish" aria-label="Search the encyclopedia">
      <kbd>/</kbd>
      <div id="sugg" role="listbox"></div>
    </div>
    <div class="hbtns">
      <button class="ibtn" id="rand"  title="Surprise me" aria-label="Random article">🎲</button>
      <button class="ibtn" id="saved" title="Saved articles" aria-label="Saved articles">⭐<span class="n" id="savedN" hidden>0</span></button>
      <button class="ibtn" id="theme" title="Dark / light" aria-label="Toggle theme">🌙</button>
      <button class="ibtn" id="replay" title="Replay intro" aria-label="Replay intro">🐦</button>
    </div>
  </header>
  <aside id="nav" aria-label="Topics"></aside>
  <main id="main"><div class="wrap" id="view"></div></main>
</div>
 
<div id="modal" aria-modal="true" role="dialog"></div>
 
<script>
/* =====================================================================
   2. CONFIG  – the easy knobs
   ===================================================================== */
const CONFIG = {
  siteName: "Vibepedia",
  introTitle: "Vibepedia",
  introSubtitle: "the whole world, explained for Gen Z & Gen Alpha",
  introAutoCloseSeconds: 8,   // intro closes by itself after this many seconds
  showIntro: true,            // false = skip the intro entirely
  liveSearch: true,           // true = also search Wikipedia live (needs internet)
  wikiLang: "en",             // "hi" for Hindi Wikipedia, "es" for Spanish etc.
  wikiResults: 4,             // how many live results to show
  suggestionLimit: 7,
  tryChips: ["rizz","black holes","Roblox","Hinglish","how Wi-Fi works","Delhi smog","Minecraft","dreams"]
};
 
/* =====================================================================
   3. DATA – the encyclopedia. EDIT / ADD HERE.
   Each category:
     id      unique short id
     emoji   shown in the sidebar
     name    category title
     color   tile / accent color (keep it light-ish so dark text reads)
     fx      background animation → float | rise | fall | bounce | drift | twinkle | orbit
     icons   emojis used by that animation
     blurb   one-line intro
     items   [ "Title", "Short explanation", "optional Wikipedia search term" ]
   ===================================================================== */
const DATA = [
{ id:"internet", emoji:"🌐", name:"Internet Culture", color:"#ff8fc7", fx:"float", icons:["😂","💀","🔥","📈","🧠","🐸"],

const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return k in mem?mem[k]:d; } },

};

/* ---------- toast ---------- */
function toast(msg){
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>t.remove(),1800);

/* ---------- topic animation engine (canvas emoji particles) ---------- */
const fx = { cv:$("#fx"), ctx:$("#fx").getContext("2d"), parts:[], bursts:[], mode:"float", icons:["✨"], raf:0, W:0, H:0 };
function sizeFx(){
  const d=Math.min(devicePixelRatio||1,2);
  fx.W=innerWidth; fx.H=innerHeight;
  fx.cv.width=fx.W*d; fx.cv.height=fx.H*d;
  fx.ctx.setTransform(d,0,0,d,0,0);
}
addEventListener("resize",sizeFx); sizeFx();
 
function mk(init){
  const {W,H}=fx;
  const p={e:pick(fx.icons),s:rnd(20,46),x:rnd(0,W),y:rnd(0,H),ph:rnd(0,6.28),a:rnd(.2,.45),r:0,vr:rnd(-.02,.02),vx:0,vy:0,ang:rnd(0,6.28),rad:rnd(90,Math.min(W,H)*.55),sp:rnd(.002,.006)};
  switch(fx.mode){
    case "float": p.vy=-rnd(.25,.9); if(!init)p.y=H+60; break;
    case "rise":  p.vy=-rnd(.7,1.6); if(!init)p.y=H+60; break;
    case "fall":  p.vy=rnd(.7,2);    if(!init)p.y=-60;  break;
    case "bounce":p.vx=rnd(-1.6,1.6);p.vy=rnd(-7,0); break;
    case "drift": p.vx=rnd(.3,1);    if(!init)p.x=-60;  break;
    case "twinkle":p.a=0; break;
  }
  return p;
}
function setFx(mode, icons){
  fx.mode=mode; fx.icons=icons; fx.parts=[];
  const n = reduce ? 0 : (innerWidth<700 ? 14 : 30);
  for(let i=0;i<n;i++) fx.parts.push(mk(true));
  if(!fx.raf) loopFx();
}
function stepFx(p){
  const {W,H}=fx; p.ph+=.02; p.r+=p.vr;
  switch(fx.mode){
    case "float": case "rise": p.y+=p.vy; p.x+=Math.sin(p.ph)*.6; if(p.y<-70) Object.assign(p,mk(false)); break;
    case "fall": p.y+=p.vy; p.x+=Math.sin(p.ph)*.3; if(p.y>H+70) Object.assign(p,mk(false)); break;
    case "bounce": p.vy+=.2; p.y+=p.vy; p.x+=p.vx;
      if(p.y>H-p.s){ p.y=H-p.s; p.vy*=-.85; if(Math.abs(p.vy)<2.5) p.vy=-rnd(9,15); }
      if(p.x<-40) p.x=W+40; if(p.x>W+40) p.x=-40; break;
    case "drift": p.x+=p.vx; p.y+=Math.sin(p.ph)*.7; if(p.x>W+70) Object.assign(p,mk(false)); break;
    case "twinkle": p.a=.08+.42*Math.abs(Math.sin(p.ph*.6)); break;
    case "orbit": p.ang+=p.sp; p.x=W/2+Math.cos(p.ang)*p.rad*1.25; p.y=H/2+Math.sin(p.ang)*p.rad*.65; break;
  }
}
function loopFx(){
  fx.raf=requestAnimationFrame(loopFx);
  const {ctx,W,H}=fx; ctx.clearRect(0,0,W,H);
  ctx.textAlign="center"; ctx.textBaseline="middle";
  for(const p of fx.parts){
    stepFx(p);
    ctx.save(); ctx.globalAlpha=p.a; ctx.translate(p.x,p.y); ctx.rotate(p.r);
    ctx.font=`${p.s}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; ctx.fillText(p.e,0,0); ctx.restore();
  }
  for(let i=fx.bursts.length-1;i>=0;i--){
    const b=fx.bursts[i]; b.vy+=.35; b.x+=b.vx; b.y+=b.vy; b.r+=b.vr; b.life--;
    if(b.life<=0){ fx.bursts.splice(i,1); continue; }
    ctx.save(); ctx.globalAlpha=Math.min(1,b.life/25); ctx.translate(b.x,b.y); ctx.rotate(b.r);
    ctx.font=`${b.s}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; ctx.fillText(b.e,0,0); ctx.restore();
  }
}
function burst(x,y,icons){
  if(reduce) return;
  for(let i=0;i<26;i++){
    const a=rnd(0,6.28), v=rnd(4,12);
    fx.bursts.push({e:pick(icons),x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,r:0,vr:rnd(-.3,.3),s:rnd(20,38),life:rnd(45,80)});
  }
}

function cardHTML(a,i,toks=[]){

function hl(s,toks){
  let out=esc(s); if(!toks.length) return out;
  const re=new RegExp("("+toks.map(t=>reEsc(esc(t))).join("|")+")","gi");
  return out.replace(re,"<mark>$1</mark>");
}

/* ---------- live "whole world" lookup (Wikipedia API) ---------- */
async function wikiLookup(query){
  const base=`https://${CONFIG.wikiLang}.wikipedia.org`;
  const r=await fetch(`${base}/w/api.php?action=opensearch&search=${encodeURIComponent(query)}&limit=${CONFIG.wikiResults}&namespace=0&format=json&origin=*`);
  const j=await r.json(); const titles=j[1]||[];
  const sums=await Promise.all(titles.map(t=>
    fetch(`${base}/api/rest_v1/page/summary/${encodeURIComponent(t)}`).then(x=>x.json()).catch(()=>null)));
  return sums.filter(s=>s&&s.extract);
}
async function loadLive(query,box){
  box.innerHTML=`<div class="note"><span class="loading">🌀</span> Asking the internet about “${esc(query)}”…</div>`;
  try{
    const res=await wikiLookup(query);
    if(!res.length){ box.innerHTML=`<div class="note">No live results found. Try different words.</div>`; return; }
    box.innerHTML=res.map(s=>`<div class="lcard">
      ${s.thumbnail?`<img src="${esc(s.thumbnail.source)}" alt="" loading="lazy">`:""}
      <div><b>${esc(s.title)}</b>${s.description?` <small style="color:var(--muted)">· ${esc(s.description)}</small>`:""}
      <p>${esc(s.extract)}</p>
      <a href="${esc(s.content_urls?.desktop?.page||'#')}" target="_blank" rel="noopener">Read on Wikipedia ↗</a></div></div>`).join("")
      + `<p class="note">Live text from Wikipedia (CC BY-SA).</p>`;
  }catch(err){
    box.innerHTML=`<div class="note">😵 Couldn’t reach the live service. This feature needs an internet connection and a page opened in your browser (not a restricted preview).</div>`;
  }
}
 
/* ---------- SEARCH ---------- */
function lev(a,b){
  if(Math.abs(a.length-b.length)>2) return 9;
  const d=Array.from({length:a.length+1},(_,i)=>[i]);
  for(let j=1;j<=b.length;j++) d[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length];
}
const WORDS = ALL.map(a => (a.title+" "+a.cat.name+" "+a.text).toLowerCase().match(/[a-z0-9]+/g)||[]);
function fuzzyHit(k,idx){
  if(k.length<4) return false;
  const lim=k.length>6?2:1;
  return WORDS[idx].some(w=>Math.abs(w.length-k.length)<=lim&&lev(k,w)<=lim);
}
function tokens(q){ return q.toLowerCase().split(/[^a-z0-9\u0900-\u097F]+/i).filter(Boolean); }
function search(q){
  const toks=tokens(q); if(!toks.length) return [];
  const out=[];
  ALL.forEach((a,idx)=>{
    const t=a.title.toLowerCase(), x=a.text.toLowerCase(), c=a.cat.name.toLowerCase();
    let s=0, hit=0;
    for(const k of toks){
      let h=0;
      if(t===k) h+=12; else if(t.startsWith(k)) h+=8; else if(t.includes(k)) h+=6;
      if(c.includes(k)) h+=2;
      if(x.includes(k)) h+=3;
      if(!h&&fuzzyHit(k,idx)) h+=1.5;
      if(h){hit++; s+=h;}
    }
    if(hit===toks.length) s+=4;               // matched every word → bonus
    if(hit>0&&(hit===toks.length||toks.length===1||hit>=2)) out.push({a,s});
  });
  return out.sort((p,q)=>q.s-p.s);
}
function catMatches(q){
  const toks=tokens(q); if(!toks.length) return [];
  return DATA.filter(c=>toks.every(k=>c.name.toLowerCase().includes(k)));
}
 
/* suggestions dropdown */
const input=$("#q"), sugg=$("#sugg"); let selIdx=-1, suggItems=[];
function renderSugg(){
  const q=input.value.trim(); selIdx=-1;
  if(!q){ sugg.classList.remove("open"); return; }
  const toks=tokens(q);
  const cats=catMatches(q).slice(0,2);
  const res=search(q).slice(0,CONFIG.suggestionLimit);
  suggItems=[
    ...cats.map(c=>({type:"cat",id:c.id,e:c.emoji,t:c.name,s:"Topic · "+c.items.length+" articles"})),
    ...res.map(r=>({type:"item",id:r.a.id,e:r.a.cat.emoji,t:r.a.title,s:r.a.cat.name})),
    ...(CONFIG.liveSearch?[{type:"live",id:q,e:"🌍",t:`Search the world for “${q}”`,s:"Live results from Wikipedia"}]:[])
  ];
  sugg.innerHTML=suggItems.map((s,i)=>`<button role="option" data-i="${i}"><span class="e">${s.e}</span><span>${hl(s.t,toks)}<small>${esc(s.s)}</small></span></button>`).join("");
  sugg.classList.add("open");
}
function pickSugg(i){
  const s=suggItems[i]; if(!s) return;
  sugg.classList.remove("open");
  if(s.type==="cat") openCategory(s.id);
  else if(s.type==="item"){ openCategory(BYID[s.id].cat.id); openItem(s.id); }
  else runSearch(s.id,true);
}
input.addEventListener("input",renderSugg);
input.addEventListener("focus",renderSugg);
input.addEventListener("keydown",e=>{
  const btns=$$("#sugg button");
  if(e.key==="ArrowDown"){ e.preventDefault(); selIdx=Math.min(btns.length-1,selIdx+1); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); selIdx=Math.max(-1,selIdx-1); }
  else if(e.key==="Enter"){ e.preventDefault(); if(selIdx>=0) pickSugg(selIdx); else if(input.value.trim()) runSearch(input.value.trim()); return; }
  else if(e.key==="Escape"){ sugg.classList.remove("open"); input.blur(); return; }
  else return;
  btns.forEach((b,i)=>b.classList.toggle("sel",i===selIdx));
});
sugg.addEventListener("mousedown",e=>{ const b=e.target.closest("button"); if(b){ e.preventDefault(); pickSugg(+b.dataset.i); } });
document.addEventListener("click",e=>{ if(!e.target.closest(".search")) sugg.classList.remove("open"); });
 
function runSearch(q){
  q=q.trim(); if(!q) return;
  sugg.classList.remove("open"); input.value=q;
  state={view:"search",cat:null,q}; renderNav();
  setFx("twinkle",["🔎","✨","💡","❓"]);
  const toks=tokens(q), res=search(q), cats=catMatches(q);
  setView(`
    <div class="crumb"><button data-go="home">Home</button> / Search</div>
    <h3 class="sec" style="margin-top:0">🔎 “${esc(q)}” <small>${res.length} result${res.length===1?"":"s"} in Vibepedia</small></h3>
    ${cats.length?`<div class="chips" style="margin:0 0 14px">${cats.map(c=>`<button class="chip" data-cat="${c.id}">${c.emoji} ${esc(c.name)}</button>`).join("")}</div>`:""}
    ${res.length?`<div class="grid" style="margin-top:0">${res.slice(0,30).map((r,i)=>cardHTML(r.a,i,toks)).join("")}</div>`
      :`<div class="empty">Hmm, nothing in our library 🫥<br><small style="font-family:var(--body)">Check the live results below, or try another word.</small></div>`}
    ${CONFIG.liveSearch?`<h3 class="sec">🌍 Live from the world <small>Wikipedia</small></h3><div class="live" id="liveRes"></div>`:""}`);
  if(CONFIG.liveSearch) loadLive(q,$("#liveRes"));
}
 
/* ---------- header buttons & keys ---------- */
$("#logo").addEventListener("click",goHome);
$("#rand").addEventListener("click",()=>{ const a=pick(ALL); openCategory(a.cat.id); openItem(a.id); });
$("#saved").addEventListener("click",showSaved);
$("#replay").addEventListener("click",playIntro);
$("#skip").addEventListener("click",closeIntro);
$("#enter").addEventListener("click",closeIntro);
$("#theme").addEventListener("click",()=>{
  const dark=(document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"))==="dark";
  const next=dark?"light":"dark"; document.documentElement.dataset.theme=next; store.set("vibe-theme",next);
  $("#theme").textContent=next==="dark"?"☀️":"🌙";
});
addEventListener("keydown",e=>{
  if(e.key==="/"&&document.activeElement!==input&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); input.focus(); }
  if(e.key==="Escape"){ closeModal(); }
});
 
/* ---------- boot ---------- */
(function init(){
  document.title=CONFIG.siteName+" – the whole world, explained";
  $("#siteName").textContent=CONFIG.siteName;
  const th=store.get("vibe-theme",null);
  if(th){ document.documentElement.dataset.theme=th; $("#theme").textContent=th==="dark"?"☀️":"🌙"; }
  updateSavedN(); goHome();
  if(CONFIG.showIntro) playIntro(); else $("#intro").style.display="none";
})();
</script>
